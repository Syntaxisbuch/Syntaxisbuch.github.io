<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d">
<title id="t">Zwei Leitern, ein Weg</title>
<desc id="d">Zwei Leitern nebeneinander mit vier bzw. drei Sprossen. Links das Dojo aus Band VI: weißer, grüner, brauner und schwarzer Gürtel – das Können in der Anwendung. Rechts die Werkstatt: Handwerker, Geselle und Architekt – die Tiefe des Wissens im Nachschlagewerk. Ein Doppelpfeil verbindet beide Leitern und zeigt: Beides misst nicht dasselbe, sondern zwei Seiten derselben Meisterschaft.</desc>
<rect x="1" y="1" width="898" height="518" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Zwei Leitern, ein Weg</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Das Dojo misst das Können, die Werkstatt das Wissen – beides gehört zur selben Meisterschaft</text>

<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle">
<!-- LINKS: Dojo -->
<rect x="60" y="88" width="330" height="392" rx="14" fill="#e3ecf7" stroke="#2b5d9c" stroke-width="2"/>
<text x="225" y="116" font-size="17" font-weight="bold" fill="#2b5d9c">Das Dojo (Band VI)</text>
<text x="225" y="136" font-size="12" fill="#5a6b7d">Das Können in der Anwendung</text>
<!-- Leiter: zwei Holme, vier Sprossen -->
<line x1="150" y1="170" x2="150" y2="440" stroke="#9aa9b8" stroke-width="6" stroke-linecap="round"/>
<line x1="300" y1="170" x2="300" y2="440" stroke="#9aa9b8" stroke-width="6" stroke-linecap="round"/>
<line x1="150" y1="410" x2="300" y2="410" stroke="#9aa9b8" stroke-width="6"/>
<line x1="150" y1="330" x2="300" y2="330" stroke="#9aa9b8" stroke-width="6"/>
<line x1="150" y1="250" x2="300" y2="250" stroke="#9aa9b8" stroke-width="6"/>
<line x1="150" y1="185" x2="300" y2="185" stroke="#9aa9b8" stroke-width="6"/>
<!-- Sprossen-Beschriftung, von unten nach oben -->
<rect x="120" y="418" width="210" height="40" rx="9" fill="#ffffff" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="225" y="435" font-size="12" font-weight="bold" fill="#1b2a3a">Weißer Gürtel</text><text x="225" y="450" font-size="10" fill="#5a6b7d">Werkzeuge erkennen</text>
<rect x="120" y="338" width="210" height="40" rx="9" fill="#ffffff" stroke="#3a9b5c" stroke-width="2"/>
<text x="225" y="355" font-size="12" font-weight="bold" fill="#1b2a3a">Grüner Gürtel</text><text x="225" y="370" font-size="10" fill="#5a6b7d">Prozesse anwenden</text>
<rect x="120" y="258" width="210" height="40" rx="9" fill="#ffffff" stroke="#8a5a34" stroke-width="2"/>
<text x="225" y="275" font-size="12" font-weight="bold" fill="#1b2a3a">Brauner Gürtel</text><text x="225" y="290" font-size="10" fill="#5a6b7d">Strategie entwickeln</text>
<rect x="120" y="163" width="210" height="40" rx="9" fill="#33475b"/>
<text x="225" y="180" font-size="12" font-weight="bold" fill="#ffffff">Schwarzer Gürtel</text><text x="225" y="195" font-size="10" fill="#cbd5e0">Lehren, Selbstbeherrschung</text>

<!-- RECHTS: Werkstatt -->
<rect x="510" y="88" width="330" height="392" rx="14" fill="#fdf1ea" stroke="#c4531b" stroke-width="2"/>
<text x="675" y="116" font-size="17" font-weight="bold" fill="#c4531b">Die Werkstatt (Cluster A–H)</text>
<text x="675" y="136" font-size="12" fill="#5a6b7d">Die Tiefe des Wissens im Nachschlagewerk</text>
<line x1="600" y1="200" x2="600" y2="440" stroke="#e0b090" stroke-width="6" stroke-linecap="round"/>
<line x1="750" y1="200" x2="750" y2="440" stroke="#e0b090" stroke-width="6" stroke-linecap="round"/>
<line x1="600" y1="410" x2="750" y2="410" stroke="#e0b090" stroke-width="6"/>
<line x1="600" y1="305" x2="750" y2="305" stroke="#e0b090" stroke-width="6"/>
<line x1="600" y1="215" x2="750" y2="215" stroke="#e0b090" stroke-width="6"/>
<rect x="570" y="418" width="210" height="40" rx="9" fill="#ffffff" stroke="#e0b090" stroke-width="1.5"/>
<text x="675" y="435" font-size="12" font-weight="bold" fill="#1b2a3a">Handwerker</text><text x="675" y="450" font-size="10" fill="#5a6b7d">kennt die Werkzeuge</text>
<rect x="570" y="313" width="210" height="40" rx="9" fill="#ffffff" stroke="#c4531b" stroke-width="2"/>
<text x="675" y="330" font-size="12" font-weight="bold" fill="#1b2a3a">Geselle</text><text x="675" y="345" font-size="10" fill="#5a6b7d">wendet sie sicher an</text>
<rect x="570" y="193" width="210" height="40" rx="9" fill="#c4531b"/>
<text x="675" y="210" font-size="12" font-weight="bold" fill="#ffffff">Architekt</text><text x="675" y="225" font-size="10" fill="#fdf1ea">entwirft und lehrt selbst</text>

<!-- Doppelpfeil in der Mitte -->
<defs><marker id="da" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#5a6b7d"/></marker></defs>
<line x1="398" y1="280" x2="502" y2="280" stroke="#5a6b7d" stroke-width="2.5" marker-end="url(#da)" marker-start="url(#da)"/>
<text x="450" y="266" font-size="11" fill="#5a6b7d">misst nicht</text>
<text x="450" y="300" font-size="11" fill="#5a6b7d">dasselbe</text>
</g>
<rect x="150" y="470" width="600" height="34" rx="10" fill="#f3f6fa" stroke="#c9d3de" stroke-width="1.5"/>
<text x="450" y="492" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1b2a3a">Schwarzer Gürtel und Architekt: zwei Seiten derselben Meisterschaft</text>
</svg>
