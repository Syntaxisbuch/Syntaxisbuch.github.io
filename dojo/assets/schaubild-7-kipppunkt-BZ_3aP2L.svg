<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d">
<title id="t">Der Kipppunkt: linear bis zur Kante, dann der Sprung</title>
<desc id="d">Zwei Diagramme. Links das Glas an der Tischkante: Mit jedem Schieben bewegt sich das Glas gleichmäßig weiter, bis es die Kante erreicht; ein weiterer Millimeter, und es stürzt zu Boden. Rechts das virale Video: Tag 1 fünfzig Views, Tag 2 sechzig, Tag 3 siebzig – lineares Wachstum; am Tag 4 teilt ein einflussreicher Account das Video, die verstärkende Schleife zündet, und die Zahl springt auf eine Million.</desc>
<rect x="1" y="1" width="898" height="538" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Der Kipppunkt: linear bis zur Kante, dann der Sprung</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Eine winzige zusätzliche Änderung, und das ganze System wechselt seinen Zustand</text>
<defs><marker id="ak" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#c4531b"/></marker></defs>

<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle">
<!-- LINKS: das Glas -->
<rect x="30" y="88" width="415" height="418" rx="14" fill="#e3ecf7" stroke="#2b5d9c" stroke-width="2"/>
<text x="237" y="116" font-size="16" font-weight="bold" fill="#2b5d9c">Das Glas an der Tischkante</text>
<text x="237" y="136" font-size="12" fill="#5a6b7d">Jeder Schub bewegt es gleich weit – bis zum letzten</text>
<!-- Tisch -->
<rect x="70" y="330" width="250" height="14" fill="#33475b"/>
<rect x="80" y="344" width="12" height="80" fill="#33475b"/><rect x="298" y="344" width="12" height="80" fill="#33475b"/>
<text x="195" y="446" font-size="11" fill="#5a6b7d">Tisch</text>
<line x1="60" y1="424" x2="420" y2="424" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="400" y="446" font-size="11" fill="#5a6b7d">Boden</text>
<!-- Gläser: Positionen 1..4 auf dem Tisch, 5 an der Kante, 6 fallend -->
<g fill="#ffffff" stroke="#2b5d9c" stroke-width="2">
<rect x="98" y="292" width="24" height="38" rx="3" opacity="0.35"/>
<rect x="146" y="292" width="24" height="38" rx="3" opacity="0.5"/>
<rect x="194" y="292" width="24" height="38" rx="3" opacity="0.65"/>
<rect x="242" y="292" width="24" height="38" rx="3" opacity="0.8"/>
<rect x="290" y="292" width="24" height="38" rx="3"/>
</g>
<g fill="#ffffff" stroke="#c4531b" stroke-width="2.5">
<rect x="336" y="372" width="24" height="38" rx="3" transform="rotate(35 348 391)"/>
</g>
<!-- Schub-Pfeile und Beschriftung -->
<g font-size="10.5" fill="#1b2a3a">
<text x="110" y="280">1 cm</text><text x="158" y="280">1 cm</text><text x="206" y="280">1 cm</text><text x="254" y="280">1 cm</text>
<text x="302" y="280" font-weight="bold" fill="#c4531b">+ 1 mm</text>
</g>
<g stroke="#2b5d9c" stroke-width="2" fill="none">
<path d="M 124 311 L 142 311" marker-end="url(#ak)"/><path d="M 172 311 L 190 311" marker-end="url(#ak)"/><path d="M 220 311 L 238 311" marker-end="url(#ak)"/><path d="M 268 311 L 286 311" marker-end="url(#ak)"/>
</g>
<path d="M 316 311 C 330 311 340 330 344 360" fill="none" stroke="#c4531b" stroke-width="2.5" stroke-dasharray="5 4" marker-end="url(#ak)"/>
<text x="320" y="246" font-size="11" font-weight="bold" fill="#c4531b">Kante = Kipppunkt</text>
<line x1="320" y1="250" x2="320" y2="268" stroke="#c4531b" stroke-width="1.5" stroke-dasharray="3 3"/>
<!-- Zustandskurve klein: linear, dann Sprung -->
<text x="237" y="178" font-size="11" fill="#5a6b7d">Vier gleiche Schübe, vier gleiche Bewegungen: das System ist stabil.</text>
<text x="237" y="194" font-size="11" fill="#5a6b7d">Der fünfte, winzige Schub ändert alles – nicht weil er größer war,</text>
<text x="237" y="210" font-size="11" fill="#5a6b7d">sondern weil er die Schwelle überschritt.</text>
<text x="237" y="480" font-size="11.5" font-weight="bold" fill="#1b2a3a">Die Kunst ist, die Kante zu sehen, bevor das Glas fällt.</text>

<!-- RECHTS: das Video -->
<rect x="455" y="88" width="415" height="418" rx="14" fill="#fdf1ea" stroke="#c4531b" stroke-width="2"/>
<text x="662" y="116" font-size="16" font-weight="bold" fill="#c4531b">Das virale Video</text>
<text x="662" y="136" font-size="12" fill="#5a6b7d">Views pro Tag – links linear, rechts nach dem Auslöser</text>
<!-- Achsen -->
<line x1="500" y1="400" x2="850" y2="400" stroke="#9aa9b8" stroke-width="1.5"/>
<line x1="500" y1="400" x2="500" y2="170" stroke="#9aa9b8" stroke-width="1.5"/>
<text x="510" y="164" font-size="10" fill="#9aa9b8" text-anchor="start">Views (Höhe nicht maßstäblich)</text>
<!-- Tage -->
<g font-size="10.5" fill="#1b2a3a">
<text x="530" y="418">Tag 1</text><text x="585" y="418">Tag 2</text><text x="640" y="418">Tag 3</text><text x="695" y="418">Tag 4</text><text x="770" y="418">danach</text>
</g>
<!-- lineare Phase: drei Punkte mit Zahl -->
<line x1="530" y1="390" x2="640" y2="382" stroke="#2b5d9c" stroke-width="2.5"/>
<circle cx="530" cy="390" r="5" fill="#2b5d9c"/><text x="530" y="376" font-size="11" font-weight="bold" fill="#2b5d9c">50</text>
<circle cx="585" cy="386" r="5" fill="#2b5d9c"/><text x="585" y="372" font-size="11" font-weight="bold" fill="#2b5d9c">60</text>
<circle cx="640" cy="382" r="5" fill="#2b5d9c"/><text x="640" y="368" font-size="11" font-weight="bold" fill="#2b5d9c">70</text>
<!-- Auslöser -->
<line x1="695" y1="180" x2="695" y2="400" stroke="#c4531b" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="695" cy="378" r="6" fill="#ffffff" stroke="#c4531b" stroke-width="2.5"/>
<text x="600" y="232" font-size="10.5" font-weight="bold" fill="#c4531b">Auslöser (Tag 4):</text>
<text x="600" y="246" font-size="10.5" fill="#c4531b">ein einflussreicher Account</text>
<text x="600" y="260" font-size="10.5" fill="#c4531b">teilt das Video</text>
<!-- exponentielle Phase: Kurve ohne erfundene Zwischenwerte -->
<path d="M 695 378 C 740 372 780 330 815 200" fill="none" stroke="#c4531b" stroke-width="3.5" marker-end="url(#ak)"/>
<text x="790" y="186" font-size="11" font-weight="bold" fill="#c4531b">1.000.000</text>
<text x="662" y="446" font-size="10.5" fill="#5a6b7d">Tag 1–3: plus 10 pro Tag, gleichmäßig.</text>
<text x="662" y="460" font-size="10.5" fill="#5a6b7d">Ab dem Auslöser zündet die verstärkende Schleife:</text>
<text x="662" y="480" font-size="10.5" font-weight="bold" fill="#1b2a3a">mehr Views → mehr Empfehlungen → mehr Shares → noch mehr Views</text>
</g>
<text x="450" y="526" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#5a6b7d">Beide Systeme wirkten stabil, bis sie kippten – der Detektor fragt: Wo ist die Schwelle, und was ist der Auslöser?</text>
</svg>
