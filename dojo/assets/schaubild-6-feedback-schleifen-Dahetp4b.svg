<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d">
<title id="t">Zwei Arten von Feedback-Schleifen</title>
<desc id="d">Zwei Kreisläufe nebeneinander. Links die ausgleichende Schleife am Beispiel des Thermostats: Ziel 21 Grad, Sensor misst 19 Grad, Signal Heizen, die Heizung läuft, die Temperatur steigt, der Sensor misst 21 Grad, Signal Stopp – das System kehrt zum Ziel zurück und bleibt stabil. Rechts die verstärkende Schleife am Beispiel des viralen Videos: mehr Views führen zu mehr Empfehlungen, mehr Empfehlungen zu mehr Shares, mehr Shares zu noch mehr Views – jede Runde macht die nächste größer, bis das System kippt.</desc>
<rect x="1" y="1" width="898" height="538" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Zwei Arten von Feedback-Schleifen</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Das Ergebnis einer Handlung fließt als neue Information in dieselbe Handlung zurück</text>
<defs>
<marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2b5d9c"/></marker>
<marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#c4531b"/></marker>
</defs>

<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle">
<!-- LINKS: ausgleichend -->
<rect x="30" y="88" width="415" height="418" rx="14" fill="#e3ecf7" stroke="#2b5d9c" stroke-width="2"/>
<text x="237" y="116" font-size="16" font-weight="bold" fill="#2b5d9c">Ausgleichende Schleife: der Thermostat</text>
<text x="237" y="136" font-size="12" fill="#5a6b7d">Mehr von X führt zu weniger von Y – das System sucht sein Ziel</text>
<!-- Kreis: Mittelpunkt (237,305), Radius 112; Stationen bei 90°, 18°, -54°, -126°, -198° -->
<path d="M 237 193 A 112 112 0 0 1 344 270" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 344 270 A 112 112 0 0 1 303 396" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 303 396 A 112 112 0 0 1 171 396" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 171 396 A 112 112 0 0 1 130 270" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 130 270 A 112 112 0 0 1 237 193" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<!-- Stationen -->
<rect x="172" y="170" width="130" height="44" rx="9" fill="#2b5d9c"/>
<text x="237" y="188" font-size="12" font-weight="bold" fill="#ffffff">Ziel: 21 °C</text><text x="237" y="204" font-size="10.5" fill="#e3ecf7">so soll es sein</text>
<rect x="300" y="248" width="120" height="44" rx="9" fill="#ffffff" stroke="#2b5d9c" stroke-width="2"/>
<text x="360" y="266" font-size="12" font-weight="bold" fill="#1b2a3a">Sensor: 19 °C</text><text x="360" y="282" font-size="10.5" fill="#5a6b7d">zu kalt</text>
<rect x="255" y="374" width="120" height="44" rx="9" fill="#ffffff" stroke="#2b5d9c" stroke-width="2"/>
<text x="315" y="392" font-size="12" font-weight="bold" fill="#1b2a3a">Signal: „Heizen!“</text><text x="315" y="408" font-size="10.5" fill="#5a6b7d">Anpassung</text>
<rect x="100" y="374" width="120" height="44" rx="9" fill="#ffffff" stroke="#2b5d9c" stroke-width="2"/>
<text x="160" y="392" font-size="12" font-weight="bold" fill="#1b2a3a">Heizung läuft</text><text x="160" y="408" font-size="10.5" fill="#5a6b7d">Handlung</text>
<rect x="55" y="248" width="120" height="44" rx="9" fill="#ffffff" stroke="#2b5d9c" stroke-width="2"/>
<text x="115" y="266" font-size="12" font-weight="bold" fill="#1b2a3a">Sensor: 21 °C</text><text x="115" y="282" font-size="10.5" fill="#5a6b7d">Signal: „Stopp!“</text>
<text x="237" y="300" font-size="12" font-weight="bold" fill="#2b5d9c">zurück zum Ziel</text>
<text x="237" y="318" font-size="10.5" fill="#5a6b7d">jede Runde macht die</text>
<text x="237" y="332" font-size="10.5" fill="#5a6b7d">Abweichung kleiner</text>
<text x="237" y="454" font-size="12" font-weight="bold" fill="#1b2a3a">Wirkung: Stabilität</text>
<text x="237" y="472" font-size="10.5" fill="#5a6b7d">Körpertemperatur, Hungergefühl, das Diät-Plateau:</text>
<text x="237" y="486" font-size="10.5" fill="#5a6b7d">das System reagiert gegen jede Abweichung</text>

<!-- RECHTS: verstärkend -->
<rect x="455" y="88" width="415" height="418" rx="14" fill="#fdf1ea" stroke="#c4531b" stroke-width="2"/>
<text x="662" y="116" font-size="16" font-weight="bold" fill="#c4531b">Verstärkende Schleife: das virale Video</text>
<text x="662" y="136" font-size="12" fill="#5a6b7d">Mehr von X führt zu noch mehr von X – das System eskaliert</text>
<!-- Kreis mit wachsender Strichstärke: Mittelpunkt (662,305), Radius 112; Stationen oben, rechts, unten, links -->
<path d="M 662 193 A 112 112 0 0 1 774 305" fill="none" stroke="#c4531b" stroke-width="2" marker-end="url(#ao)"/>
<path d="M 774 305 A 112 112 0 0 1 662 417" fill="none" stroke="#c4531b" stroke-width="3.2" marker-end="url(#ao)"/>
<path d="M 662 417 A 112 112 0 0 1 550 305" fill="none" stroke="#c4531b" stroke-width="4.4" marker-end="url(#ao)"/>
<path d="M 550 305 A 112 112 0 0 1 662 193" fill="none" stroke="#c4531b" stroke-width="5.6" marker-end="url(#ao)"/>
<rect x="597" y="170" width="130" height="44" rx="9" fill="#c4531b"/>
<text x="662" y="188" font-size="12" font-weight="bold" fill="#ffffff">mehr Views</text><text x="662" y="204" font-size="10.5" fill="#fdf1ea">Tag 1: 50, Tag 2: 60 …</text>
<rect x="746" y="283" width="120" height="44" rx="9" fill="#ffffff" stroke="#c4531b" stroke-width="2"/>
<text x="806" y="301" font-size="11" font-weight="bold" fill="#1b2a3a">mehr Empfehlungen</text><text x="806" y="317" font-size="10.5" fill="#5a6b7d">der Algorithmus</text>
<rect x="597" y="395" width="130" height="44" rx="9" fill="#ffffff" stroke="#c4531b" stroke-width="2"/>
<text x="662" y="413" font-size="12" font-weight="bold" fill="#1b2a3a">mehr Shares</text><text x="662" y="429" font-size="10.5" fill="#5a6b7d">Menschen teilen es</text>
<rect x="458" y="283" width="120" height="44" rx="9" fill="#ffffff" stroke="#c4531b" stroke-width="2"/>
<text x="518" y="301" font-size="11" font-weight="bold" fill="#1b2a3a">noch mehr Views</text><text x="518" y="317" font-size="10.5" fill="#5a6b7d">die nächste Runde</text>
<text x="662" y="300" font-size="12" font-weight="bold" fill="#c4531b">jede Runde größer</text>
<text x="662" y="318" font-size="10.5" fill="#5a6b7d">bis zum Kipppunkt:</text>
<text x="662" y="332" font-size="10.5" fill="#5a6b7d">1.000.000 Views</text>
<text x="662" y="472" font-size="12" font-weight="bold" fill="#1b2a3a">Wirkung: Eskalation oder Kollaps</text>
<text x="662" y="490" font-size="10.5" fill="#5a6b7d">Zinseszins, virale Gerüchte, Massenpanik, Abhängigkeit</text>
</g>
<path d="M 298.0 211.1 L 307.5 218.0" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 345.2 334.0 L 341.6 345.1" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 242.9 416.8 L 231.1 416.8" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 132.4 345.1 L 128.8 334.0" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 166.5 218.0 L 176.0 211.1" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#ab)"/>
<path d="M 736.9 221.8 L 745.2 230.1" fill="none" stroke="#c4531b" stroke-width="2" marker-end="url(#ao)"/>
<path d="M 745.2 379.9 L 736.9 388.2" fill="none" stroke="#c4531b" stroke-width="3.2" marker-end="url(#ao)"/>
<path d="M 587.1 388.2 L 578.8 379.9" fill="none" stroke="#c4531b" stroke-width="4.4" marker-end="url(#ao)"/>
<path d="M 578.8 230.1 L 587.1 221.8" fill="none" stroke="#c4531b" stroke-width="5.6" marker-end="url(#ao)"/>
<text x="450" y="526" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="11" fill="#5a6b7d">Wer in Schleifen denkt, fragt nicht „Was bewirkt meine Handlung?“, sondern „Wie antwortet das System auf meine Handlung?“</text>
</svg>
