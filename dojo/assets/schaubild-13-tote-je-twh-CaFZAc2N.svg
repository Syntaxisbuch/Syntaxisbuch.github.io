<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
<title id="t">Tote je Terawattstunde: Kohle, Öl, Gas, Wasser, Kernenergie, Wind, Sonne</title>
<desc id="d">Balkendiagramm mit logarithmischer Skala. Todesfälle je erzeugter Terawattstunde Strom, Unfälle und Luftverschmutzung eingerechnet: Kohle etwa 25, Öl etwa 18, Erdgas etwa 3, Wasserkraft etwa 1,3, Kernenergie etwa 0,03, Windkraft etwa 0,04, Sonnenenergie etwa 0,02. Kernenergie, Wind und Sonne liegen in derselben, sehr niedrigen Größenordnung, obwohl Kernenergie in der Wahrnehmung meist als weitaus gefährlicher gilt.</desc>
<rect x="1" y="1" width="898" height="558" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Tote je Terawattstunde Strom</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Unfälle und Luftverschmutzung zusammen – logarithmische Skala, jede Linie zehnmal mehr</text>

<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif">
<!-- Log-Skala: 0.01 bis 100, y=440 (0.01) bis y=110 (100), 4 Dekaden zu je 82.5px -->
<!-- Gitterlinien bei 0.01, 0.1, 1, 10, 100 -->
<g stroke="#d6dde6" stroke-width="1">
<line x1="130" y1="440" x2="850" y2="440"/>
<line x1="130" y1="357.5" x2="850" y2="357.5"/>
<line x1="130" y1="275" x2="850" y2="275"/>
<line x1="130" y1="192.5" x2="850" y2="192.5"/>
<line x1="130" y1="110" x2="850" y2="110"/>
</g>
<g font-size="11" fill="#9aa9b8" text-anchor="end">
<text x="120" y="444">0,01</text>
<text x="120" y="361.5">0,1</text>
<text x="120" y="279">1</text>
<text x="120" y="196.5">10</text>
<text x="120" y="114">100</text>
</g>
<text x="60" y="275" text-anchor="middle" font-size="11" fill="#5a6b7d" transform="rotate(-90 60 275)">Todesfälle je Terawattstunde (log)</text>
<line x1="130" y1="440" x2="850" y2="440" stroke="#9aa9b8" stroke-width="1.5"/>
<!-- Balken: log10(v), Skalierung: y = 440 - (log10(v)+2)*82.5 -->
<!-- Kohle 24.6 -> log=1.391 -> y=440-(3.391*82.5)=440-279.8=160.2 -->
<!-- Öl 18.4 -> log=1.265 -> y=440-269.7=170.3 -->
<!-- Gas 2.8 -> log=0.447 -> y=440-202.0=238.0 -->
<!-- Wasser 1.3 -> log=0.114 -> y=440-174.4=265.6 -->
<!-- Kernenergie 0.03 -> log=-1.523 -> y=440-39.4=400.6 -->
<!-- Wind 0.04 -> log=-1.398 -> y=440-49.6=390.4 -->
<!-- Sonne 0.02 -> log=-1.699 -> y=440-24.8=415.2 -->
<g text-anchor="middle">
<rect x="150" y="160.2" width="70" height="279.8" fill="#33475b"/>
<text x="185" y="150" font-size="13" font-weight="bold" fill="#33475b">≈ 25</text>
<rect x="250" y="170.3" width="70" height="269.7" fill="#4a5a6b"/>
<text x="285" y="160" font-size="13" font-weight="bold" fill="#4a5a6b">≈ 18</text>
<rect x="350" y="238.0" width="70" height="202.0" fill="#7a8a9b"/>
<text x="385" y="228" font-size="13" font-weight="bold" fill="#7a8a9b">≈ 3</text>
<rect x="450" y="265.6" width="70" height="174.4" fill="#2b5d9c"/>
<text x="485" y="256" font-size="13" font-weight="bold" fill="#2b5d9c">≈ 1,3</text>
<rect x="550" y="400.6" width="70" height="39.4" fill="#c4531b"/>
<text x="585" y="391" font-size="13" font-weight="bold" fill="#c4531b">≈ 0,03</text>
<rect x="650" y="390.4" width="70" height="49.6" fill="#3a9b5c"/>
<text x="685" y="381" font-size="13" font-weight="bold" fill="#3a9b5c">≈ 0,04</text>
<rect x="750" y="415.2" width="70" height="24.8" fill="#e0b34a"/>
<text x="785" y="406" font-size="13" font-weight="bold" fill="#e0b34a">≈ 0,02</text>
</g>
<g font-size="12" fill="#1b2a3a" text-anchor="middle">
<text x="185" y="460">Kohle</text>
<text x="285" y="460">Öl</text>
<text x="385" y="460">Erdgas</text>
<text x="485" y="460">Wasser</text>
<text x="585" y="460">Kern-</text><text x="585" y="474">energie</text>
<text x="685" y="460">Wind</text>
<text x="785" y="460">Sonne</text>
</g>
<!-- Klammer um Kern/Wind/Sonne -->
<path d="M 550 490 L 550 500 L 820 500 L 820 490" fill="none" stroke="#5a6b7d" stroke-width="1.5"/>
<text x="685" y="514" text-anchor="middle" font-size="11" font-weight="bold" fill="#5a6b7d">dieselbe Größenordnung</text>
</g>
<text x="450" y="532" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#5a6b7d">Daten: Markandya &amp; Wilkinson (2007), The Lancet 370; Ritchie (2020), Our World in Data</text>
<!-- KI-Kennzeichen (wie auf dem Cover) -->
<image href="data:image/png;base64," x="814" y="512" width="72" height="34" preserveAspectRatio="xMidYMid meet" aria-hidden="true"/>
</svg>
