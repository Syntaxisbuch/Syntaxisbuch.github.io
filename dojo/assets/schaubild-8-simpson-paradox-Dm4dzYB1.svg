<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
<title id="t">Das Simpson-Paradox: Berkeley 1973</title>
<desc id="d">Zwei Balkendiagramme mit den Zulassungsquoten der sechs größten Fachbereiche der Universität Berkeley 1973. Links alle sechs zusammengerechnet: Männer 45 Prozent (1.198 von 2.691 Bewerbungen zugelassen), Frauen 30 Prozent (557 von 1.835). Rechts jeder Fachbereich einzeln: A Männer 62, Frauen 82 Prozent; B 63 zu 68; C 37 zu 34; D 33 zu 35; E 28 zu 24; F 6 zu 7. Unter den Balken die Zahl der Bewerbungen je Fach. Erklärung: 51 Prozent der Männer, aber nur 7 Prozent der Frauen bewarben sich in den Fächern A und B mit den höchsten Quoten.</desc>
<rect x="1" y="1" width="898" height="598" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Das Simpson-Paradox: Berkeley 1973</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Zulassungsquote = Zugelassene geteilt durch Bewerbungen · die sechs größten Fachbereiche</text>

<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle">
<!-- Legende -->
<rect x="330" y="82" width="16" height="12" fill="#2b5d9c"/><text x="353" y="93" font-size="12" fill="#1b2a3a" text-anchor="start">Männer</text>
<rect x="440" y="82" width="16" height="12" fill="#c4531b"/><text x="463" y="93" font-size="12" fill="#1b2a3a" text-anchor="start">Frauen</text>

<!-- LINKS: alle sechs zusammen -->
<rect x="40" y="108" width="250" height="392" rx="12" fill="#f3f6fa" stroke="#c9d3de" stroke-width="1.5"/>
<text x="165" y="134" font-size="15" font-weight="bold" fill="#1b2a3a">Alle sechs zusammen</text>
<text x="165" y="152" font-size="11" fill="#5a6b7d">so, wie es in der Statistik stand</text>
<!-- Achse: 0 % bei y=420, 100 % bei y=180 -> 2,4 px pro Prozentpunkt -->
<g stroke="#d6dde6" stroke-width="1">
<line x1="75" y1="420" x2="270" y2="420"/><line x1="75" y1="360" x2="270" y2="360"/><line x1="75" y1="300" x2="270" y2="300"/><line x1="75" y1="240" x2="270" y2="240"/><line x1="75" y1="180" x2="270" y2="180"/>
</g>
<g font-size="9.5" fill="#9aa9b8" text-anchor="end">
<text x="70" y="424">0 %</text><text x="70" y="364">25 %</text><text x="70" y="304">50 %</text><text x="70" y="244">75 %</text><text x="70" y="184">100 %</text>
</g>
<line x1="75" y1="420" x2="270" y2="420" stroke="#9aa9b8" stroke-width="1.5"/>
<rect x="100" y="312" width="60" height="108" fill="#2b5d9c"/>
<text x="130" y="302" font-size="16" font-weight="bold" fill="#2b5d9c">45 %</text>
<rect x="185" y="348" width="60" height="72" fill="#c4531b"/>
<text x="215" y="338" font-size="16" font-weight="bold" fill="#c4531b">30 %</text>
<text x="165" y="440" font-size="10.5" fill="#2b5d9c">Männer: 1.198 von 2.691 zugelassen</text>
<text x="165" y="456" font-size="10.5" fill="#c4531b">Frauen: 557 von 1.835 zugelassen</text>
<text x="165" y="486" font-size="11.5" font-weight="bold" fill="#1b2a3a">Sieht aus wie Benachteiligung</text>

<!-- RECHTS: nach Fachbereich -->
<rect x="310" y="108" width="560" height="392" rx="12" fill="#f3f6fa" stroke="#c9d3de" stroke-width="1.5"/>
<text x="590" y="134" font-size="15" font-weight="bold" fill="#1b2a3a">Jeder Fachbereich einzeln</text>
<text x="590" y="152" font-size="11" fill="#5a6b7d">dieselben Bewerbungen, nach Fach A bis F aufgeteilt</text>
<g stroke="#d6dde6" stroke-width="1">
<line x1="345" y1="420" x2="850" y2="420"/><line x1="345" y1="360" x2="850" y2="360"/><line x1="345" y1="300" x2="850" y2="300"/><line x1="345" y1="240" x2="850" y2="240"/><line x1="345" y1="180" x2="850" y2="180"/>
</g>
<g font-size="9.5" fill="#9aa9b8" text-anchor="end">
<text x="340" y="424">0 %</text><text x="340" y="364">25 %</text><text x="340" y="304">50 %</text><text x="340" y="244">75 %</text><text x="340" y="184">100 %</text>
</g>
<line x1="345" y1="420" x2="850" y2="420" stroke="#9aa9b8" stroke-width="1.5"/>
<!-- Balken: Höhe = Prozent * 2,4 ; Männer x, Frauen x+33 -->
<!-- A 62 / 82 -->
<rect x="355" y="271.2" width="30" height="148.8" fill="#2b5d9c"/><rect x="388" y="223.2" width="30" height="196.8" fill="#c4531b"/>
<text x="370" y="264" font-size="10.5" fill="#2b5d9c">62 %</text><text x="403" y="216" font-size="10.5" fill="#c4531b">82 %</text>
<!-- B 63 / 68 -->
<rect x="438" y="268.8" width="30" height="151.2" fill="#2b5d9c"/><rect x="471" y="256.8" width="30" height="163.2" fill="#c4531b"/>
<text x="453" y="261" font-size="10.5" fill="#2b5d9c">63 %</text><text x="486" y="249" font-size="10.5" fill="#c4531b">68 %</text>
<!-- C 37 / 34 -->
<rect x="521" y="331.2" width="30" height="88.8" fill="#2b5d9c"/><rect x="554" y="338.4" width="30" height="81.6" fill="#c4531b"/>
<text x="536" y="324" font-size="10.5" fill="#2b5d9c">37 %</text><text x="569" y="331" font-size="10.5" fill="#c4531b">34 %</text>
<!-- D 33 / 35 -->
<rect x="604" y="340.8" width="30" height="79.2" fill="#2b5d9c"/><rect x="637" y="336" width="30" height="84" fill="#c4531b"/>
<text x="619" y="333" font-size="10.5" fill="#2b5d9c">33 %</text><text x="652" y="328" font-size="10.5" fill="#c4531b">35 %</text>
<!-- E 28 / 24 -->
<rect x="687" y="352.8" width="30" height="67.2" fill="#2b5d9c"/><rect x="720" y="362.4" width="30" height="57.6" fill="#c4531b"/>
<text x="702" y="345" font-size="10.5" fill="#2b5d9c">28 %</text><text x="735" y="355" font-size="10.5" fill="#c4531b">24 %</text>
<!-- F 6 / 7 -->
<rect x="770" y="405.6" width="30" height="14.4" fill="#2b5d9c"/><rect x="803" y="403.2" width="30" height="16.8" fill="#c4531b"/>
<text x="785" y="398" font-size="10.5" fill="#2b5d9c">6 %</text><text x="818" y="396" font-size="10.5" fill="#c4531b">7 %</text>
<!-- Fachbezeichnungen -->
<g font-size="13" font-weight="bold" fill="#1b2a3a">
<text x="386" y="440">A</text><text x="469" y="440">B</text><text x="552" y="440">C</text><text x="635" y="440">D</text><text x="718" y="440">E</text><text x="801" y="440">F</text>
</g>
<!-- Bewerbungen je Fach, zwei Zeilen mit Beschriftung -->
<g font-size="10" fill="#2b5d9c">
<text x="386" y="458">825</text><text x="469" y="458">560</text><text x="552" y="458">325</text><text x="635" y="458">417</text><text x="718" y="458">191</text><text x="801" y="458">373</text>
</g>
<g font-size="10" fill="#c4531b">
<text x="386" y="472">108</text><text x="469" y="472">25</text><text x="552" y="472">593</text><text x="635" y="472">375</text><text x="718" y="472">393</text><text x="801" y="472">341</text>
</g>
<text x="590" y="484" font-size="9.5" fill="#5a6b7d">Zahl der Bewerbungen je Fach: Männer oben (blau), Frauen unten (orange)</text>
<text x="590" y="497" font-size="11.5" font-weight="bold" fill="#1b2a3a">In vier von sechs Fächern liegt die Quote der Frauen gleichauf oder höher</text>
</g>

<!-- Erklärung -->
<rect x="40" y="512" width="830" height="60" rx="10" fill="#fdf1ea" stroke="#c4531b" stroke-width="1.5"/>
<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle" font-size="12" fill="#1b2a3a">
<text x="455" y="534" font-weight="bold" font-size="11.5">Die Auflösung: 51 % der Männer, aber nur 7 % der Frauen bewarben sich in A und B, den Fächern mit den höchsten Quoten.</text>
<text x="455" y="556" font-size="11.5">Wer alles zusammenwirft, vergleicht Bewerber in leichten Fächern mit Bewerbern in schweren. Erst die Aufteilung zeigt das wahre Bild.</text>
</g>
<text x="450" y="590" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="10" fill="#5a6b7d">Daten: Bickel, Hammel &amp; O'Connell (1975), Science 187, Tabelle der sechs größten Fachbereiche – Quoten gerundet</text>
</svg>
