<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d">
<title id="t">Hierarchie der Evidenz</title>
<desc id="d">Pyramide mit fünf Stufen, von unten nach oben zunehmend aussagekräftig: 1 Anekdoten und Expertenmeinungen, 2 Fall-Kontroll-Studien, 3 Kohortenstudien, 4 randomisierte kontrollierte Studien, 5 systematische Reviews und Meta-Analysen.</desc>
<rect x="1" y="1" width="898" height="538" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="44" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Hierarchie der Evidenz</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>
<line x1="45" y1="470" x2="45" y2="92" stroke="#5a6b7d" stroke-width="3" marker-end="url(#ah)"/>
<text transform="translate(30,280) rotate(-90)" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">zunehmende Aussagekraft</text>
<polygon points="70.0,470.0 470.0,470.0 430.0,390.0 110.0,390.0" fill="#dce8f5" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
<text x="270" y="439.0" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">1</text>
<line x1="458.0" y1="430.0" x2="495" y2="430.0" stroke="#9aa9b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="505" y="426.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1b2a3a">Anekdoten &amp; Expertenmeinungen</text>
<text x="505" y="446.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#4a5a6b">Einzelne Geschichten, Meinungen ohne Daten</text>
<polygon points="110.0,390.0 430.0,390.0 390.0,310.0 150.0,310.0" fill="#b3cde8" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
<text x="270" y="359.0" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">2</text>
<line x1="418.0" y1="350.0" x2="495" y2="350.0" stroke="#9aa9b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="505" y="346.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1b2a3a">Fall-Kontroll-Studien</text>
<text x="505" y="366.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#4a5a6b">Betroffene mit Nicht-Betroffenen verglichen</text>
<polygon points="150.0,310.0 390.0,310.0 350.0,230.0 190.0,230.0" fill="#7ea9d6" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
<text x="270" y="279.0" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">3</text>
<line x1="378.0" y1="270.0" x2="495" y2="270.0" stroke="#9aa9b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="505" y="266.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1b2a3a">Kohortenstudien</text>
<text x="505" y="286.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#4a5a6b">Große Gruppen über Jahre beobachtet</text>
<polygon points="190.0,230.0 350.0,230.0 310.0,150.0 230.0,150.0" fill="#3f7cbf" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
<text x="270" y="199.0" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">4</text>
<line x1="338.0" y1="190.0" x2="495" y2="190.0" stroke="#9aa9b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="505" y="186.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1b2a3a">Randomisierte kontrollierte Studien</text>
<text x="505" y="206.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#4a5a6b">(RCTs): Zufallsverteilung und Kontrollgruppe</text>
<polygon points="230.0,150.0 310.0,150.0 270,70" fill="#1d4f8a" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
<text x="270" y="131.0" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#ffffff">5</text>
<line x1="303.0" y1="120.0" x2="495" y2="120.0" stroke="#9aa9b8" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="505" y="116.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#1b2a3a">Systematische Reviews &amp; Meta-Analysen</text>
<text x="505" y="136.0" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" fill="#4a5a6b">Fassen alle guten Studien zu einer Frage zusammen</text>
<text x="450" y="515" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-style="italic" fill="#4a5a6b">Vereinfachte Lehrfassung – entscheidend ist immer auch die Qualität der einzelnen Studie.</text>
</svg>