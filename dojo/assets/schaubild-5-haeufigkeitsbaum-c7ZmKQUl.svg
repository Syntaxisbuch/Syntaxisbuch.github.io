<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d">
<title id="t">Der Test des Arztes in natürlichen Häufigkeiten</title>
<desc id="d">Baumdiagramm. Von einer Million Menschen sind 100 krank und 999.900 gesund. Von den 100 Kranken testet der Test 99 positiv und 1 negativ. Von den 999.900 Gesunden testet er 9.999 fälschlich positiv und 989.901 richtig negativ. Von allen 10.098 positiven Tests sind nur 99 echt, also weniger als ein Prozent.</desc>
<rect x="1" y="1" width="898" height="538" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Der Test des Arztes in natürlichen Häufigkeiten</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Sensitivität 99 % · Spezifität 99 % · die Krankheit trifft 1 von 10.000</text>

<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle">
<!-- Ebene 0 -->
<rect x="340" y="92" width="220" height="56" rx="10" fill="#33475b"/>
<text x="450" y="116" font-size="17" font-weight="bold" fill="#ffffff">1.000.000 Menschen</text>
<text x="450" y="136" font-size="12" fill="#e3ecf7">machen den Test</text>
<!-- Linien Ebene 0 -> 1 -->
<path d="M 450 148 C 450 178 230 168 230 198" fill="none" stroke="#9aa9b8" stroke-width="3"/>
<path d="M 450 148 C 450 178 670 168 670 198" fill="none" stroke="#9aa9b8" stroke-width="3"/>
<!-- Ebene 1 -->
<rect x="130" y="198" width="200" height="56" rx="10" fill="#c4531b"/>
<text x="230" y="222" font-size="17" font-weight="bold" fill="#ffffff">100 krank</text>
<text x="230" y="242" font-size="12" fill="#fdf1ea">1 von 10.000</text>
<rect x="570" y="198" width="200" height="56" rx="10" fill="#2b5d9c"/>
<text x="670" y="222" font-size="17" font-weight="bold" fill="#ffffff">999.900 gesund</text>
<text x="670" y="242" font-size="12" fill="#e3ecf7">9.999 von 10.000</text>
<!-- Linien Ebene 1 -> 2 -->
<path d="M 230 254 C 230 284 120 274 120 304" fill="none" stroke="#9aa9b8" stroke-width="3"/>
<path d="M 230 254 C 230 284 340 274 340 304" fill="none" stroke="#9aa9b8" stroke-width="3"/>
<path d="M 670 254 C 670 284 560 274 560 304" fill="none" stroke="#9aa9b8" stroke-width="3"/>
<path d="M 670 254 C 670 284 780 274 780 304" fill="none" stroke="#9aa9b8" stroke-width="3"/>
<text x="150" y="288" font-size="11" fill="#5a6b7d">99 %</text>
<text x="310" y="288" font-size="11" fill="#5a6b7d">1 %</text>
<text x="590" y="288" font-size="11" fill="#5a6b7d">1 %</text>
<text x="750" y="288" font-size="11" fill="#5a6b7d">99 %</text>
<!-- Ebene 2 -->
<rect x="35" y="304" width="170" height="62" rx="10" fill="#fdf1ea" stroke="#c4531b" stroke-width="3"/>
<text x="120" y="330" font-size="18" font-weight="bold" fill="#c4531b">99</text>
<text x="120" y="350" font-size="12" fill="#1b2a3a">Test positiv – richtig</text>
<rect x="255" y="304" width="170" height="62" rx="10" fill="#ffffff" stroke="#9aa9b8" stroke-width="2"/>
<text x="340" y="330" font-size="18" font-weight="bold" fill="#4a5a6b">1</text>
<text x="340" y="350" font-size="12" fill="#1b2a3a">Test negativ – übersehen</text>
<rect x="475" y="304" width="170" height="62" rx="10" fill="#fdf1ea" stroke="#c4531b" stroke-width="3"/>
<text x="560" y="330" font-size="18" font-weight="bold" fill="#c4531b">9.999</text>
<text x="560" y="350" font-size="12" fill="#1b2a3a">Test positiv – falscher Alarm</text>
<rect x="695" y="304" width="170" height="62" rx="10" fill="#ffffff" stroke="#9aa9b8" stroke-width="2"/>
<text x="780" y="330" font-size="18" font-weight="bold" fill="#4a5a6b">989.901</text>
<text x="780" y="350" font-size="12" fill="#1b2a3a">Test negativ – richtig</text>
<!-- Zusammenführung der positiven -->
<path d="M 120 366 C 120 402 450 380 450 412" fill="none" stroke="#c4531b" stroke-width="3" stroke-dasharray="6 5"/>
<path d="M 560 366 C 560 402 450 380 450 412" fill="none" stroke="#c4531b" stroke-width="3" stroke-dasharray="6 5"/>
<rect x="165" y="412" width="570" height="68" rx="12" fill="#fdf1ea" stroke="#c4531b" stroke-width="2.5"/>
<text x="450" y="440" font-size="16" font-weight="bold" fill="#1b2a3a">10.098 positive Tests – nur 99 davon sind echt</text>
<text x="450" y="464" font-size="14" fill="#c4531b" font-weight="bold">Wahrscheinlichkeit, bei positivem Test krank zu sein: 99 / 10.098 ≈ 1 %</text>
<text x="450" y="512" font-size="12" fill="#5a6b7d">Das Gefühl sagt 99 %. Die Zählung sagt 1 %. Der Unterschied ist die Basisrate.</text>
</g>
</svg>
