<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
<title id="t">Das BITE-Modell der Gedankenkontrolle</title>
<desc id="d">Vier Quadranten nach Steven Hassan. B: Verhaltenskontrolle – Wohnort, Kleidung, Schlaf, Finanzen und soziale Kontakte werden reguliert. I: Informationskontrolle – Zugang zu Außenmedien eingeschränkt, Bespitzelung untereinander. T: Gedankenkontrolle – die Ideologie als einzige Wahrheit, geladene Sprache, gedankenstoppende Klischees. E: Emotionskontrolle – Wechsel aus Love Bombing und Angst, Schuld und Scham, indoktrinierte Phobien vor dem Verlassen der Gruppe. Der Hinweis am unteren Rand: Es geht nicht um den Glauben, sondern um Struktur und Verhalten.</desc>
<rect x="1" y="1" width="898" height="558" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Das BITE-Modell der Gedankenkontrolle</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Vier Bereiche, in denen manipulative Systeme Kontrolle ausüben – nach Steven Hassan</text>

<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif">
<!-- Quadrant B: oben links -->
<rect x="40" y="88" width="400" height="200" rx="14" fill="#e3ecf7" stroke="#2b5d9c" stroke-width="2"/>
<circle cx="80" cy="118" r="20" fill="#2b5d9c"/><text x="80" y="125" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">B</text>
<text x="112" y="124" font-size="15" font-weight="bold" fill="#2b5d9c">Behavior Control</text>
<text x="112" y="140" font-size="11" fill="#5a6b7d">Verhaltenskontrolle</text>
<g font-size="11.5" fill="#1b2a3a">
<text x="62" y="168">•  Wohnort, Kontakte und Tagesablauf werden reguliert</text>
<text x="62" y="188">•  Kleidung, Essen und Schlaf werden vorgeschrieben</text>
<text x="62" y="208">•  finanzielle Abhängigkeit wird geschaffen</text>
<text x="62" y="228">•  System aus Belohnung und Bestrafung</text>
<text x="62" y="248">•  Individualität entmutigt, Konformität gefordert</text>
</g>

<!-- Quadrant I: oben rechts -->
<rect x="460" y="88" width="400" height="200" rx="14" fill="#fdf1ea" stroke="#c4531b" stroke-width="2"/>
<circle cx="500" cy="118" r="20" fill="#c4531b"/><text x="500" y="125" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">I</text>
<text x="532" y="124" font-size="15" font-weight="bold" fill="#c4531b">Information Control</text>
<text x="532" y="140" font-size="11" fill="#5a6b7d">Informationskontrolle</text>
<g font-size="11.5" fill="#1b2a3a">
<text x="482" y="168">•  Zugang zu externen Quellen eingeschränkt</text>
<text x="482" y="188">•  „Systemmedien“, „Abtrünnigen-Propaganda“</text>
<text x="482" y="208">•  Wissen hierarchisch verteilt, „Geheimwissen“</text>
<text x="482" y="228">•  aktive Desinformation innerhalb der Gruppe</text>
<text x="482" y="248">•  Mitglieder bespitzeln und melden einander</text>
</g>

<!-- Quadrant T: unten links -->
<rect x="40" y="308" width="400" height="200" rx="14" fill="#eef3ea" stroke="#3a9b5c" stroke-width="2"/>
<circle cx="80" cy="338" r="20" fill="#3a9b5c"/><text x="80" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">T</text>
<text x="112" y="344" font-size="15" font-weight="bold" fill="#3a9b5c">Thought Control</text>
<text x="112" y="360" font-size="11" fill="#5a6b7d">Gedankenkontrolle</text>
<g font-size="11.5" fill="#1b2a3a">
<text x="62" y="388">•  die Ideologie als einzige, absolute Wahrheit</text>
<text x="62" y="408">•  geladene Sprache framt die Realität neu</text>
<text x="62" y="428">•  kritisches Denken als egoistisch gebrandmarkt</text>
<text x="62" y="448">•  gedankenstoppende Klischees würgen Zweifel ab</text>
</g>

<!-- Quadrant E: unten rechts -->
<rect x="460" y="308" width="400" height="200" rx="14" fill="#f6eaf3" stroke="#a5478f" stroke-width="2"/>
<circle cx="500" cy="338" r="20" fill="#a5478f"/><text x="500" y="345" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">E</text>
<text x="532" y="344" font-size="15" font-weight="bold" fill="#a5478f">Emotional Control</text>
<text x="532" y="360" font-size="11" fill="#5a6b7d">Emotionskontrolle</text>
<g font-size="11.5" fill="#1b2a3a">
<text x="482" y="388">•  Wechsel aus „Love Bombing“ und Angst</text>
<text x="482" y="408">•  Schuld- und Schamgefühle als Kontrollmittel</text>
<text x="482" y="428">•  indoktrinierte Phobien vor dem Verlassen</text>
<text x="482" y="448">•  Katastrophen werden für Aussteiger angedroht</text>
</g>
</g>
<rect x="150" y="522" width="600" height="26" rx="8" fill="#f3f6fa" stroke="#c9d3de" stroke-width="1.5"/>
<text x="450" y="540" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="11.5" font-weight="bold" fill="#1b2a3a">Es geht nicht um den Glauben (Theologie), sondern um Struktur und Verhalten</text>
</svg>
