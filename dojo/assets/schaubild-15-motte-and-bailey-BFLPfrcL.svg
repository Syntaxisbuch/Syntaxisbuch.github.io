<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
<title id="t">Die Motte-and-Bailey-Täuschung</title>
<desc id="d">Eine mittelalterliche Burganlage von der Seite. Rechts der Bailey, ein weites, offenes Gehöft: dort steht die kühne, kaum verteidigbare Behauptung, im Beispiel des Werks: unsere Methode heilt jede Krankheit. Links, durch einen Graben getrennt und erhöht, die Motte, ein kleiner, stark befestigter Turm auf einem Hügel: dort steht die bescheidene, leicht zu verteidigende Position, im Beispiel: eine positive Einstellung hilft dem Heilungsprozess. Ein Pfeil zeigt den Rückzug von der Bailey zur Motte bei Gegenwind, ein zweiter den Vorstoß zurück zur Bailey, sobald der Angriff vorbei ist.</desc>
<rect x="1" y="1" width="898" height="558" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Die Motte-and-Bailey-Täuschung</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Eine kühne Behauptung, verteidigt aus einer bescheidenen Festung</text>

<g font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" text-anchor="middle">
<!-- Bodenlinie -->
<line x1="40" y1="400" x2="860" y2="400" stroke="#9aa9b8" stroke-width="2"/>

<!-- BAILEY: rechts, weites offenes Gehöft -->
<rect x="470" y="360" width="360" height="40" fill="#e3ecf7"/>
<rect x="470" y="352" width="360" height="10" fill="#c9d3de"/>
<!-- niedriger Palisadenzaun -->
<g stroke="#9aa9b8" stroke-width="4">
<line x1="480" y1="352" x2="480" y2="330"/><line x1="520" y1="352" x2="520" y2="330"/><line x1="560" y1="352" x2="560" y2="330"/><line x1="600" y1="352" x2="600" y2="330"/><line x1="640" y1="352" x2="640" y2="330"/><line x1="680" y1="352" x2="680" y2="330"/><line x1="720" y1="352" x2="720" y2="330"/><line x1="760" y1="352" x2="760" y2="330"/><line x1="800" y1="352" x2="800" y2="330"/>
</g>
<text x="650" y="120" font-size="16" font-weight="bold" fill="#c4531b">Die Bailey</text>
<text x="650" y="140" font-size="11.5" fill="#5a6b7d">weit, offen, kaum zu verteidigen</text>
<rect x="500" y="150" width="300" height="90" rx="10" fill="#fdf1ea" stroke="#c4531b" stroke-width="2"/>
<text x="650" y="172" font-size="12" font-weight="bold" fill="#c4531b">Die kühne Behauptung:</text>
<text x="650" y="192" font-size="11.5" fill="#1b2a3a">„Unsere Methode heilt jede</text>
<text x="650" y="208" font-size="11.5" fill="#1b2a3a">Krankheit -- Krebs, AIDS, alles.“</text>
<text x="650" y="228" font-size="10.5" fill="#5a6b7d">weitreichend, angreifbar, schwer zu belegen</text>
<line x1="650" y1="240" x2="650" y2="320" stroke="#c4531b" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- Graben -->
<path d="M 420 400 Q 445 420 420 440 L 460 440 Q 435 420 460 400 Z" fill="#cfe0ee"/>
<rect x="420" y="400" width="40" height="40" fill="#cfe0ee"/>
<text x="440" y="455" font-size="10" fill="#5a6b7d">Graben</text>

<!-- MOTTE: links, kleiner Hügel mit Turm -->
<path d="M 60 400 L 160 400 L 130 300 L 90 300 Z" fill="#c9d3de"/>
<rect x="95" y="230" width="70" height="70" fill="#33475b"/>
<polygon points="95,230 130,195 165,230" fill="#1b2a3a"/>
<rect x="120" y="255" width="20" height="45" fill="#1b2a3a"/>
<rect x="105" y="240" width="12" height="14" fill="#5a6b7d"/><rect x="143" y="240" width="12" height="14" fill="#5a6b7d"/>
<text x="130" y="120" font-size="16" font-weight="bold" fill="#2b5d9c">Die Motte</text>
<text x="130" y="140" font-size="11.5" fill="#5a6b7d">klein, erhöht, leicht zu verteidigen</text>
<rect x="15" y="150" width="230" height="90" rx="10" fill="#e3ecf7" stroke="#2b5d9c" stroke-width="2"/>
<text x="130" y="172" font-size="12" font-weight="bold" fill="#2b5d9c">Die bescheidene Position:</text>
<text x="130" y="192" font-size="11.5" fill="#1b2a3a">„Eine positive Einstellung hilft</text>
<text x="130" y="208" font-size="11.5" fill="#1b2a3a">dem Heilungsprozess.“</text>
<text x="130" y="228" font-size="10.5" fill="#5a6b7d">vernünftig, kaum zu bestreiten</text>
<line x1="130" y1="240" x2="130" y2="290" stroke="#2b5d9c" stroke-width="1.5" stroke-dasharray="4 3"/>

<!-- Pfeile: Rückzug bei Angriff, Vorstoß danach -->
<defs><marker id="mb1" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2b5d9c"/></marker>
<marker id="mb2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#c4531b"/></marker></defs>
<path d="M 480 312 C 400 302 300 302 220 312" fill="none" stroke="#2b5d9c" stroke-width="3" marker-end="url(#mb1)"/>
<text x="350" y="334" font-size="12" font-weight="bold" fill="#2b5d9c">Rückzug, sobald Kritik kommt</text>
<path d="M 220 358 C 300 368 400 368 480 358" fill="none" stroke="#c4531b" stroke-width="3" marker-end="url(#mb2)"/>
<text x="350" y="390" font-size="12" font-weight="bold" fill="#c4531b">Vorstoß, sobald die Luft rein ist</text>
</g>
<rect x="150" y="500" width="600" height="34" rx="10" fill="#f3f6fa" stroke="#c9d3de" stroke-width="1.5"/>
<text x="450" y="522" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1b2a3a">Der Trick: so tun, als wären beide Positionen dieselbe</text>
</svg>
