<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" role="img" aria-labelledby="t d">
<title id="t">Die OODA-Schleife</title>
<desc id="d">Kreislauf aus vier Schritten: Beobachten, Orientieren, Entscheiden, Handeln. Das Ergebnis jeder Handlung wird zur neuen Beobachtung. Hervorgehoben ist das Orientieren mit den Werkzeugen Denkfehler-Check, Ockhams Rasiermesser, Quellenprüfung und Frame-Erkennung.</desc>
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 z" fill="#5a6b7d"/></marker></defs>
<rect x="1" y="1" width="898" height="578" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="44" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Die OODA-Schleife</text>
<line x1="287" y1="175" x2="605" y2="175" stroke="#5a6b7d" stroke-width="4" marker-end="url(#ah)"/>
<line x1="700" y1="262" x2="700" y2="318" stroke="#5a6b7d" stroke-width="4" marker-end="url(#ah)"/>
<line x1="603" y1="415" x2="287" y2="415" stroke="#5a6b7d" stroke-width="4" marker-end="url(#ah)"/>
<line x1="200" y1="328" x2="200" y2="262" stroke="#5a6b7d" stroke-width="4" marker-end="url(#ah)"/>
<text x="446" y="160" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="14" font-style="italic" fill="#5a6b7d">Ergebnis wird zur neuen Beobachtung</text>
<circle cx="200" cy="175" r="82" fill="#e3ecf7" stroke="#2b5d9c" stroke-width="2.5"/>
<text x="200" y="163" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#2b5d9c">ACT</text>
<text x="200" y="188" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1b2a3a">Handeln</text>
<text x="200" y="211" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#4a5a6b">Tun und prüfen</text>
<circle cx="700" cy="175" r="82" fill="#e3ecf7" stroke="#2b5d9c" stroke-width="2.5"/>
<text x="700" y="163" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#2b5d9c">OBSERVE</text>
<text x="700" y="188" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1b2a3a">Beobachten</text>
<text x="700" y="211" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#4a5a6b">Was geschieht?</text>
<circle cx="700" cy="415" r="92" fill="#fff1d6" stroke="#c77700" stroke-width="4"/>
<text x="700" y="403" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#c77700">ORIENT</text>
<text x="700" y="428" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1b2a3a">Orientieren</text>
<text x="700" y="451" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#4a5a6b">Was bedeutet es?</text>
<circle cx="200" cy="415" r="82" fill="#e3ecf7" stroke="#2b5d9c" stroke-width="2.5"/>
<text x="200" y="403" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#2b5d9c">DECIDE</text>
<text x="200" y="428" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="16" fill="#1b2a3a">Entscheiden</text>
<text x="200" y="451" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13" font-style="italic" fill="#4a5a6b">Was tue ich jetzt?</text>
<rect x="318" y="222" width="262" height="146" rx="12" fill="#ffffff" stroke="#c77700" stroke-width="2" stroke-dasharray="6 4"/>
<text x="449" y="248" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="bold" fill="#c77700">Werkzeuge beim Orientieren</text>
<circle cx="340" cy="271" r="4" fill="#c77700"/>
<text x="352" y="276" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b2a3a">Denkfehler-Check</text>
<circle cx="340" cy="295" r="4" fill="#c77700"/>
<text x="352" y="300" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b2a3a">Ockhams Rasiermesser</text>
<circle cx="340" cy="319" r="4" fill="#c77700"/>
<text x="352" y="324" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b2a3a">Quellenprüfung</text>
<circle cx="340" cy="343" r="4" fill="#c77700"/>
<text x="352" y="348" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" fill="#1b2a3a">Frame-Erkennung</text>
<line x1="580" y1="330" x2="622" y2="360" stroke="#c77700" stroke-width="2" stroke-dasharray="6 4"/>
<text x="450" y="548" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="13.5" font-style="italic" fill="#4a5a6b">Nach dem Militärstrategen John Boyd. Der entscheidende Schritt ist das Orientieren.</text>
</svg>