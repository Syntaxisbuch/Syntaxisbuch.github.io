<text x="360" y="405" font-size="9.5" fill="#5a6b7d">VII–VIII</text><text x="360" y="417" font-size="9.5" fill="#5a6b7d">zwei</text><text x="360" y="429" font-size="9.5" fill="#5a6b7d">Autopsien</text>
