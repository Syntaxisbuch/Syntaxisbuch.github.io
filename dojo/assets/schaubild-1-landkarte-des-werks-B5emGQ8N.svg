<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="t d">
<title id="t">Die Landkarte des Werks</title>
<desc id="d">Zwei Bücher. Links Buch 1, die Reise: ein Weg vom Prolog über die Bände I bis VIII zum Epilog, begleitet von Kompass, Mini-Glossar und Schutz-Kompendium. Rechts Buch 2, die Werkstatt: das Glossar mit den Clustern A bis H, die Modell-Bibliothek, 28 Fallakten, das Netzwerk, die Lösungen, die Werkstatt der Zukunft und der Stichwortindex. Pfeile zeigen: Buch 1 verweist in die Werkstatt, die Werkstatt zurück in die Reise.</desc>
<rect x="1" y="1" width="898" height="598" rx="18" fill="#ffffff" stroke="#c9d3de" stroke-width="2"/>
<text x="450" y="42" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#1b2a3a">Die Landkarte des Werks</text>
<text x="450" y="66" text-anchor="middle" font-family="DejaVu Sans, Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" fill="#5a6b7d">Zwei Bücher, ein Territorium: die Reise und die Werkstatt</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6b7d"/></marker></defs>

